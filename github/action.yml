name: "Lunos GitHub Action"
description: "Run Lunos in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  version:
    description: "Lunos version to install from npm (lunos-ai). Defaults to the latest release."
    required: false
    default: "latest"

  share:
    description: "Share the Lunos session (off unless true; sharing must also be enabled in your Lunos config)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use the GITHUB_TOKEN env var: the workflow's token or a personal access token. The default; set false only with oidc_base_url."
    required: false
    default: "true"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/lunos,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL of a GitHub App token-exchange service you run. Only with use_github_token: false; there is no default."
    required: false

runs:
  using: "composite"
  steps:
    # npm 12 skips install scripts unless allowed, and lunos-ai needs its postinstall.
    - name: Install Lunos
      shell: bash
      run: npm install -g "lunos-ai@${{ inputs.version }}" --allow-scripts=lunos-ai

    - name: Run Lunos
      shell: bash
      id: run_opencode
      run: lunos github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}

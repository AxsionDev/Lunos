<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 64" width="232" height="64" role="img" aria-label="Lunos logo">
  <!-- Lunos logo (for light backgrounds): the moon mark from lunos.tech/favicon.svg, unchanged, and the site's
       wordmark ("·lunos", JetBrains Mono bold, peach dot) as on lunos.tech. XCOD-217. -->
  <g transform="translate(2 2) scale(0.9375)">
    <defs>
    <radialGradient id="moon" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="0.45" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#fab387"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#moon)"/>
  <g fill="#fab387" fill-opacity="0.35">
    <circle cx="24" cy="26" r="6"/>
    <circle cx="41" cy="22" r="3.5"/>
    <circle cx="38" cy="41" r="7"/>
    <circle cx="22" cy="43" r="3"/>
  </g>
  </g>
  <text x="76" y="45" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="40" letter-spacing="0.8" fill="#1e1e2e"><tspan fill="#fab387">·</tspan>lunos</text>
</svg>

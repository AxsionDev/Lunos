name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  # NOTE: the inherited `push` trigger (ci/dev/beta/snapshot-*) is deliberately
  # removed. With the repository guards now re-pointed at AxsionDev/Lunos, leaving
  # it in place would turn every merge to dev into a live npm publish and GitHub
  # release. Releases are manual until that is an explicit decision — restore the
  # push block to go back to release-on-merge.
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

# XCOD-48: two no-bump dispatches produce an identical key (both `inputs.version` and
# `inputs.bump` empty), so the second queued behind the first indefinitely — a dead
# Blacksmith-era run held the group for 15 minutes on 2026-09-18. `github.run_id` makes
# every dispatch its own group, which is the right behaviour for a manually-triggered
# release: two deliberate dispatches should not silently block each other.
concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump || github.run_id }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  # XCOD-49: signing posture is "unsigned for now". Rather than hard-disabling the signing
  # jobs, detect whether the credentials exist and let them skip cleanly when they don't.
  # This is self-healing — provisioning the secrets turns signing back on with no workflow
  # edit. Secrets are not available in job-level `if:`, hence this job publishing outputs.
  preflight:
    runs-on: ubuntu-24.04
    if: github.repository == 'AxsionDev/Lunos'
    outputs:
      sign_windows: ${{ steps.check.outputs.sign_windows }}
      sign_macos: ${{ steps.check.outputs.sign_macos }}
    steps:
      - name: Detect available signing credentials
        id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TRUSTED_SIGNING_ENDPOINT" ]; then
            echo "sign_windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_windows=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows signing skipped — Azure Trusted Signing secrets absent (XCOD-49)"
          fi
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "sign_macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_macos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing skipped — APPLE_CERTIFICATE absent (XCOD-49)"
          fi

  version:
    runs-on: ubuntu-24.04
    if: github.repository == 'AxsionDev/Lunos'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # XCOD-227: v1.18.46 shipped with no CHANGELOG.md section. Fail before ./script/version.ts,
      # which creates the draft release, so a refused dispatch leaves no draft behind. The script
      # computes the version the same way version.ts does, and skips preview/beta builds.
      - name: Check CHANGELOG.md has a section for this version
        timeout-minutes: 3
        run: bun script/check-changelog.ts
        env:
          OPENCODE_BUMP: ${{ inputs.bump }}
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Install OpenCode
        if: inputs.bump || inputs.version
        run: bun i -g opencode-ai

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          OPENCODE_BUMP: ${{ inputs.bump }}
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          # Changelog generation is provider-agnostic: whichever of these is set gets used, and
          # NONE is required. A provider is auto-detected when any of its declared env vars is
          # present (provider.ts:186). If none is set, version.ts falls back to raw-changelog.ts,
          # which needs no AI at all — so the release never blocks on an AI vendor.
          # Optionally pin one with the CHANGELOG_MODEL variable, e.g. "anthropic/claude-sonnet-5".
          CHANGELOG_MODEL: ${{ vars.CHANGELOG_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Upstream's Zen gateway — supported like any other vendor, not privileged over them.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-24.04
    if: github.repository == 'AxsionDev/Lunos'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
          ./packages/cli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          # XCOD-273: the official build asks for a free Lunos account at start (docs: "Your Lunos
          # account"). Builds from source don't.
          LUNOS_OFFICIAL_BUILD: "1"
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli
          path: |
            packages/opencode/dist/lunos-darwin*
            packages/opencode/dist/lunos-linux*
          # Fail loudly on an empty glob. The default (`warn`) uploads nothing, leaves this
          # job green, and defers the error to `publish`'s download-artifact three jobs
          # later — which is exactly how the opencode-* → lunos- rename went unnoticed.
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/lunos-windows*
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-preview-cli
          path: packages/cli/dist/cli-*
          if-no-files-found: error

    outputs:
      version: ${{ needs.version.outputs.version }}

  # Software Bill of Materials for the release (XCOD-64).
  #
  # This is manufacturer-readiness groundwork, not a compliance obligation: on the XCOD-54
  # assessment Lunos is outside CRA scope today, so an SBOM is not legally owed. It exists so
  # the dependency tree can be checked against a newly disclosed upstream vulnerability, and so
  # a procurement reviewer has something concrete to read.
  sbom:
    needs: version
    runs-on: ubuntu-24.04
    if: github.repository == 'AxsionDev/Lunos'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # Pinned deliberately. syft only learned to read bun's lockfile recently: v1.20.0 parses
      # bun.lock into ZERO components and still emits a schema-valid CycloneDX document. An
      # accidental downgrade would therefore publish a convincing, empty SBOM. The verify step
      # below is what actually catches that, but pin anyway so it does not happen quietly.
      - name: Install syft
        env:
          SYFT_VERSION: v1.52.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" "$SYFT_VERSION"
          "$RUNNER_TEMP/bin/syft" version

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          "$RUNNER_TEMP/bin/syft" scan file:bun.lock \
            -o cyclonedx-json > "lunos-sbom-${VERSION}.cdx.json"

      # XCOD-108: bun.lock carries no licences, so the SBOM had none (the XCOD-64 gap). Install the
      # locked tree, then add each component's declared licence from its package.json (or, for
      # other-platform optional packages not installed here, from the registry's metadata).
      - uses: ./.github/actions/setup-bun

      - name: Add licences to the SBOM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun install --frozen-lockfile
          bun script/sbom-licenses.ts "lunos-sbom-${VERSION}.cdx.json"
          with=$(jq '[.components[] | select(.licenses)] | length' "lunos-sbom-${VERSION}.cdx.json")
          total=$(jq '.components | length' "lunos-sbom-${VERSION}.cdx.json")
          echo "Components with a licence: $with of $total"
          if [ $((with * 100 / total)) -lt 95 ]; then
            echo "::error::Only $with of $total SBOM components have a licence (expected >=95%)."
            exit 1
          fi

      # Same philosophy as `if-no-files-found: error` above: an empty artifact that leaves the
      # job green is worse than a failure, because it defers the error to whoever trusts the SBOM.
      - name: Verify SBOM is not empty
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          count=$(jq '.components | length' "lunos-sbom-${VERSION}.cdx.json")
          echo "SBOM components: $count"
          if [ "$count" -lt 100 ]; then
            echo "::error::SBOM has $count components (expected >=100). syft likely failed to" \
                 "parse bun.lock — check whether the pinned syft version still supports it."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lunos-sbom
          path: lunos-sbom-*.cdx.json
          if-no-files-found: error

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ needs.version.outputs.repo }}
        run: |
          gh release upload "v${VERSION}" "lunos-sbom-${VERSION}.cdx.json" \
            --clobber --repo "${REPO}"

  # XCOD-207: build-cli cross-compiles the darwin binaries on Linux, and embedding the JS bundle
  # leaves each one with an invalid signature. This re-signs them ad-hoc on a Mac, repacks the
  # darwin zips, and smoke-tests the arm64 binary out of its zip. `publish` swaps these in for the
  # unsigned files before npm packing, the Homebrew sha, SHA256SUMS and the offline bundles.
  # No credentials: ad-hoc signing needs no certificate, and the zips are uploaded to the release
  # by `publish`, not here. A Developer ID identity, once there is one, replaces `-` in the script.
  sign-cli-macos:
    needs:
      - build-cli
      - version
    runs-on: macos-26
    if: github.repository == 'AxsionDev/Lunos'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Re-sign, repack and smoke-test macOS CLI binaries
        run: ./packages/opencode/script/macos-resign.sh packages/opencode/dist "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-signed-macos
          path: |
            packages/opencode/dist/lunos-darwin-arm64
            packages/opencode/dist/lunos-darwin-x64
            packages/opencode/dist/lunos-darwin-x64-baseline
            packages/opencode/dist/lunos-darwin-*.zip
          if-no-files-found: error

  sign-cli-windows:
    needs:
      - build-cli
      - version
      - preflight
    runs-on: windows-2025
    # Skips entirely without Azure Trusted Signing credentials. `release-gate` allows this one
    # skip, and `publish` falls back to the unsigned `opencode-cli-windows` artifact from build-cli.
    if: github.repository == 'AxsionDev/Lunos' && needs.preflight.outputs.sign_windows == 'true'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\opencode\dist\lunos-windows-arm64\bin\opencode.exe
            ${{ github.workspace }}\packages\opencode\dist\lunos-windows-x64\bin\opencode.exe
            ${{ github.workspace }}\packages\opencode\dist\lunos-windows-x64-baseline\bin\opencode.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\opencode\dist\lunos-windows-arm64\bin\opencode.exe",
            "${{ github.workspace }}\packages\opencode\dist\lunos-windows-x64\bin\opencode.exe",
            "${{ github.workspace }}\packages\opencode\dist\lunos-windows-x64-baseline\bin\opencode.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/opencode/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "lunos-windows-arm64\bin\*" -DestinationPath "lunos-windows-arm64.zip" -Force
          Compress-Archive -Path "lunos-windows-x64\bin\*" -DestinationPath "lunos-windows-x64.zip" -Force
          Compress-Archive -Path "lunos-windows-x64-baseline\bin\*" -DestinationPath "lunos-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\opencode\dist\lunos-windows-arm64.zip" `
            "${{ github.workspace }}\packages\opencode\dist\lunos-windows-x64.zip" `
            "${{ github.workspace }}\packages\opencode\dist\lunos-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-signed-windows
          path: |
            packages/opencode/dist/lunos-windows-arm64
            packages/opencode/dist/lunos-windows-x64
            packages/opencode/dist/lunos-windows-x64-baseline

  build-electron:
    needs:
      - version
      - preflight
    if: github.repository == 'AxsionDev/Lunos'
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # github-hosted: blacksmith lacks ARM64 MSVC cross-compilation toolchain
          - host: "windows-2025"
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: "windows-2025"
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: "ubuntu-24.04"
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: "ubuntu-24.04-arm"
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # XCOD-49: without APPLE_CERTIFICATE this step fails at `security import` with
      # "Unable to decode the provided data", taking the whole macOS build with it.
      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS' && needs.preflight.outputs.sign_macos == 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS' && needs.preflight.outputs.sign_macos == 'true'
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      # XCOD-49: without Azure Trusted Signing credentials this fails with "Not all values are
      # present", which failed both Windows matrix legs and — because `publish` needs
      # build-electron — skipped the publish entirely. Same gate as sign-cli-windows.
      - name: Azure login
        if: runner.os == 'Windows' && needs.preflight.outputs.sign_windows == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          RUST_TARGET: ${{ matrix.settings.target }}
          # XCOD-312: prepare.ts runs build-node.ts as well (see Build).
          LUNOS_OFFICIAL_BUILD: "1"

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          # XCOD-312: the desktop app's server (script/build-node.ts) is an official build too, so a
          # disabled Lunos account is shown and refused there as in the CLI.
          LUNOS_OFFICIAL_BUILD: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}

      - name: Package
        if: needs.version.outputs.release
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          # XCOD-49: when unsigned, `build.keychain` was never created — point nowhere and tell
          # electron-builder not to go hunting for an identity, or it fails instead of
          # producing an unsigned artifact.
          CSC_KEYCHAIN: ${{ needs.preflight.outputs.sign_macos == 'true' && 'build.keychain' || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.preflight.outputs.sign_macos == 'true' && 'true' || 'false' }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS' && needs.version.outputs.release
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="lunos-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="lunos-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && needs.preflight.outputs.sign_windows == 'true'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\resources\opencode-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lunos-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  # XCOD-283: the one place that decides whether the release may go out. `publish` used to gate on
  # `always() && !failure() && !cancelled()`, but those only see the *run* being cancelled: when
  # GitHub never found a macOS arm64 runner (1.18.52, 1.18.53) the cancelled job counted as neither,
  # and publish started without the arm64 desktop build or the re-signed macOS CLI. Every required
  # job must now be `success`; the only exception is a skipped sign-cli-windows (no Azure secrets,
  # XCOD-49). On a block this job fails the run and names each job and why, and the draft release
  # is left as it is, so `gh run rerun --failed` (or publish-retry.yml) picks it up again.
  release-gate:
    needs:
      - version
      - preflight
      - build-cli
      # XCOD-207: not skippable. A failed re-sign must stop the release, not ship unsigned.
      - sign-cli-macos
      - sign-cli-windows
      - build-electron
      # XCOD-106: the SBOM must be on the release before SHA256SUMS is computed and signed.
      - sbom
    if: github.repository == 'AxsionDev/Lunos' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
    steps:
      - name: Require every build job to have succeeded
        timeout-minutes: 3
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          blocked=$(jq -r 'to_entries[]
            | select(.value.result != "success")
            | select(.key != "sign-cli-windows" or .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          # Also ask the API for every finished job in this attempt, one row per matrix leg, rather
          # than trusting how `needs.build-electron.result` aggregates a single cancelled leg. Only
          # this job and publish are unfinished (null conclusion). If the API is unreachable, the
          # `needs` check above still decides on its own.
          if jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
              | "\(.id)\t\(.conclusion)\t\(.name)"'); then
            if [ -n "$jobs" ] && [ -z "$blocked" ]; then blocked="(see jobs below)"; fi
          else
            jobs=""
            echo "::warning::Could not list this attempt's jobs; gating on needs results only."
          fi
          if [ -z "$blocked" ]; then
            echo "Every required job succeeded."
            exit 0
          fi
          {
            echo "### Release blocked: publish skipped, draft release left for a rerun"
            echo
            while IFS= read -r line; do echo "- $line"; done <<<"$blocked"
            echo
            echo "Jobs that did not succeed in attempt $GITHUB_RUN_ATTEMPT:"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Name the exact matrix leg and GitHub's reason, e.g. "The job was not acquired by Runner
          # of type hosted even after multiple attempts".
          while IFS=$'\t' read -r id conclusion name; do
            [ -n "$id" ] || continue
            reason=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" \
              --jq '[.[] | select(.annotation_level == "failure") | .message | split("\n")[0]] | first // ""') || reason=""
            echo "::error title=Release blocked::$name was $conclusion${reason:+: $reason}"
            echo "- \`$name\`: $conclusion${reason:+ ($reason)}" >> "$GITHUB_STEP_SUMMARY"
          done <<<"$jobs"
          exit 1

  publish:
    needs:
      - version
      - preflight
      - release-gate
    # `!cancelled()` rather than the default `success()`: release-gate itself runs past a skipped
    # sign-cli-windows, and a human cancelling the whole run must still stop publish.
    if: github.repository == 'AxsionDev/Lunos' && !cancelled() && needs.release-gate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # XCOD-106: keyless Sigstore signing of SHA256SUMS and the SBOM (release-checksums.ts).
      # Uses the workflow's OIDC token (`id-token: write` above); no key or certificate to hold.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli
          path: packages/opencode/dist

      # XCOD-207: replace the unsigned darwin binaries and zips with sign-cli-macos's, so the npm
      # platform packages and the Homebrew sha are built from the re-signed files.
      - name: Remove unsigned macOS CLI binaries
        run: rm -rf packages/opencode/dist/lunos-darwin*

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli-signed-macos
          path: packages/opencode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      # XCOD-49: only produced by sign-cli-windows. When that job skips the artifact does not
      # exist and download-artifact errors, so gate on the same flag. The unsigned Windows
      # binaries downloaded just above (opencode-cli-windows) stay in place instead — this
      # download only overwrites them with signed equivalents when signing actually ran.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.preflight.outputs.sign_windows == 'true'
        with:
          name: opencode-cli-signed-windows
          path: packages/opencode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-preview-cli
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: lunos-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Cache apt packages (AUR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - name: Upload desktop release assets
        if: needs.version.outputs.release
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            exit 1
          fi
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber --repo "${{ needs.version.outputs.repo }}"

      # XCOD-207: overwrite the unsigned darwin zips build-cli put on the draft. Must run before
      # ./script/publish.ts, whose release-checksums.ts and offline-bundles.ts download the release
      # assets to write SHA256SUMS and build the offline bundles.
      - name: Upload re-signed macOS CLI release assets
        if: needs.version.outputs.release
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" \
            packages/opencode/dist/lunos-darwin-arm64.zip \
            packages/opencode/dist/lunos-darwin-x64.zip \
            packages/opencode/dist/lunos-darwin-x64-baseline.zip \
            --clobber --repo "${{ needs.version.outputs.repo }}"

      - run: ./script/publish.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          # XCOD-48: `registry-url` is set on setup-node above, which writes an .npmrc
          # expecting NODE_AUTH_TOKEN — but nothing ever supplied it, so `npm publish`
          # could never authenticate. Upstream relies on npm Trusted Publishing (OIDC);
          # this fork uses an automation token instead. Empty until NPM_TOKEN is added
          # as a repository secret, at which point publishing works with no further edit.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LATEST_YML_DIR: /tmp/latest-yml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # XCOD-261: tell lunos.tech a release is out, so its changelog page is rebuilt from the tagged
      # CHANGELOG.md instead of being edited by hand. Sends a `lunos-changelog` repository_dispatch to
      # the repo in the CHANGELOG_DISPATCH_REPO variable (owner/name). GITHUB_TOKEN can't dispatch to
      # another repository: CHANGELOG_DISPATCH_TOKEN is a fine-grained PAT with Contents read/write on
      # that repo. Skipped, with a notice, while either is unset. The release is already public here,
      # so a failed dispatch must not fail the run; changelog-drift.yml catches a site left behind.
      - name: Notify the website of the release
        if: needs.version.outputs.release && !startsWith(needs.version.outputs.version, '0.0.0-')
        continue-on-error: true
        timeout-minutes: 3
        env:
          DISPATCH_REPO: ${{ vars.CHANGELOG_DISPATCH_REPO }}
          DISPATCH_TOKEN: ${{ secrets.CHANGELOG_DISPATCH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ needs.version.outputs.repo }}
        run: |
          if [ -z "$DISPATCH_REPO" ] || [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice title=Website not notified::Set the CHANGELOG_DISPATCH_REPO variable and the CHANGELOG_DISPATCH_TOKEN secret to update lunos.tech/changelog on release."
            exit 0
          fi
          tag="v$VERSION"
          body=$(jq -n --arg version "$VERSION" --arg tag "$tag" \
            --arg url "https://raw.githubusercontent.com/$REPO/$tag/CHANGELOG.md" \
            '{event_type: "lunos-changelog", client_payload: {version: $version, tag: $tag, changelog_url: $url}}')
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            -X POST "https://api.github.com/repos/$DISPATCH_REPO/dispatches" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$body"
          echo "Sent lunos-changelog for $tag to $DISPATCH_REPO"

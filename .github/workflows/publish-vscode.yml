name: publish-vscode

# XCOD-122: publishes the Lunos extension to the VS Code Marketplace and Open VSX under Axsion's
# publisher, and attaches the .vsix with a checksum and build provenance to a GitHub release.
# script/publish refuses any other publisher. Run it by hand with dry_run to check that guard and
# the packaging without publishing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and check the publisher only; publish nothing
        type: boolean
        default: true
  push:
    tags:
      - "vscode-v*.*.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'AxsionDev/Lunos'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Anything that isn't a push of a vscode-v* tag is a dry run: a dispatch on a branch can't
      # publish, whatever its dry_run input says.
      DRY_RUN: ${{ (github.ref_type != 'tag' || inputs.dry_run) && '1' || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - run: git fetch --force --tags
      - run: bun install -g @vscode/vsce

      - name: Install extension dependencies
        run: bun install
        working-directory: ./sdks/vscode

      - name: Publish
        run: ./script/publish
        working-directory: ./sdks/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attest build provenance
        if: env.DRY_RUN != '1'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: sdks/vscode/dist/lunos.vsix

      - name: Attach to GitHub release
        if: env.DRY_RUN != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Lunos for VS Code ${GITHUB_REF_NAME#vscode-v}" \
            --notes "VS Code Marketplace and Open VSX: publisher \`axsion\`, extension \`lunos\`. Verify with \`sha256sum -c lunos.vsix.sha256\` or \`gh attestation verify lunos.vsix --repo $GITHUB_REPOSITORY\`." \
            sdks/vscode/dist/lunos.vsix sdks/vscode/dist/lunos.vsix.sha256

      - name: Upload package
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lunos-vsix
          path: sdks/vscode/dist/lunos.vsix*

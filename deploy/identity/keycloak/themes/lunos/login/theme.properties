# XCOD-244: the Lunos login theme. Everything not overridden here comes from keycloak.v2.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/lunos.css
# Lunos is dark only: no prefers-color-scheme switch, the dark class is always on.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark
# One full-width column of social buttons whatever their number (upstream goes 2-column above 3).
kcFormSocialAccountListGridClass=
kcFormSocialAccountGridItem=pf-v5-u-pb-sm
kcFormSocialAccountListButtonClass=pf-v5-c-button pf-m-secondary pf-m-block lunos-social
# No locales= line: the parent's list stays, so all nine of the realm's supportedLocales keep working.

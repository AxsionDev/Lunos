[project]
name = "lunos"
dynamic = ["version"]
description = "Run Lunos agents from Python: sessions, streaming, custom tools, permissions, subagents and headless runs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Axsion" }]
keywords = ["lunos", "agents", "ai", "coding-agent", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]

[project.urls]
Homepage = "https://lunos.tech"
Documentation = "https://github.com/AxsionDev/Lunos/tree/dev/packages/sdk/python#readme"
Source = "https://github.com/AxsionDev/Lunos/tree/dev/packages/sdk/python"
Issues = "https://github.com/AxsionDev/Lunos/issues"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "pyright>=1.1.390", "ruff>=0.8"]
codegen = ["datamodel-code-generator==0.34.0"]
docs = ["pdoc>=15"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lunos/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lunos"]

[tool.hatch.build.targets.sdist]
include = ["src/lunos", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: starts a real Lunos server (needs the lunos binary, or LUNOS_COMMAND)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/lunos/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
exclude = ["src/lunos/_generated/models.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
